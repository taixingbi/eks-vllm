# Sync platform gateway API keys from AWS Secrets Manager (prod).
# Create secret: {"keys":["key1","key2"]}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: platform-gateway-keys
  namespace: vllm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: platform-gateway-keys
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: qwen-vllm/api-gateway-keys

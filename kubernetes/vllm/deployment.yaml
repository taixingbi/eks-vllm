apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: vllm
  labels:
    app: vllm-qwen
spec:
  replicas: __VLLM_REPLICAS__
  selector:
    matchLabels:
      app: vllm-qwen
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: __ROLLING_MAX_SURGE__
      maxUnavailable: __ROLLING_MAX_UNAVAILABLE__
  template:
    metadata:
      labels:
        app: vllm-qwen
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vllm
      terminationGracePeriodSeconds: __TERMINATION_GRACE_SECONDS__
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: vllm-qwen
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values: ["gpu"]
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      initContainers:
        - name: download-model
          image: ECR_REPOSITORY_URL:model-downloader-v2
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_PATH
            - name: MODEL_S3_URI
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_S3_URI
          command:
            - /usr/local/bin/sync-model-from-s3.sh
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      containers:
        - name: vllm
          image: ECR_REPOSITORY_URL:v0.8.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_PATH
          args:
            - --model
            - __MODEL_PATH_VALUE__
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --dtype
            - __VLLM_DTYPE__
            - --max-model-len
            - "__VLLM_MAX_MODEL_LEN__"
            - --gpu-memory-utilization
            - "__VLLM_GPU_MEMORY_UTIL__"
            - --enable-prefix-caching
            - --disable-log-requests
          resources:
            requests:
              cpu: "__VLLM_CPU_REQUEST__"
              memory: "__VLLM_MEMORY_REQUEST__"
              nvidia.com/gpu: "1"
            limits:
              cpu: "__VLLM_CPU_LIMIT__"
              memory: "__VLLM_MEMORY_LIMIT__"
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: __VLLM_STARTUP_FAILURE_THRESHOLD__
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - sleep __PRESTOP_SLEEP_SECONDS__
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: __VLLM_SHM_SIZE__

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  minAvailable: __PDB_MIN_AVAILABLE__
  selector:
    matchLabels:
      app: vllm-qwen

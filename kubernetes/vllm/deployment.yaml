apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm-qwen
  namespace: vllm
  labels:
    app: vllm-qwen
spec:
  replicas: 2
  selector:
    matchLabels:
      app: vllm-qwen
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: vllm-qwen
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: vllm
      terminationGracePeriodSeconds: 120
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: vllm-qwen
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: workload
                    operator: In
                    values: ["gpu"]
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      initContainers:
        - name: download-model
          image: huggingface/huggingface_hub:0.26.2
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_ID
            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_PATH
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -f "${MODEL_PATH}/config.json" ]; then
                echo "Model already cached at ${MODEL_PATH}, skipping download."
                exit 0
              fi
              echo "Downloading ${MODEL_ID} to ${MODEL_PATH}..."
              huggingface-cli download "${MODEL_ID}" \
                --local-dir "${MODEL_PATH}" \
                --local-dir-use-symlinks False
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 4Gi
      containers:
        - name: vllm
          image: ECR_REPOSITORY_URL:v0.8.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: MODEL_PATH
              valueFrom:
                configMapKeyRef:
                  name: vllm-config
                  key: MODEL_PATH
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
          command:
            - python
            - -m
            - vllm.entrypoints.openai.api_server
          args:
            - --model
            - /models/Qwen3-8B
            - --host
            - "0.0.0.0"
            - --port
            - "8000"
            - --dtype
            - bfloat16
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.90"
            - --enable-prefix-caching
            - --disable-log-requests
          resources:
            requests:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 56Gi
              nvidia.com/gpu: "1"
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 5
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm
  namespace: vllm

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: vllm-qwen

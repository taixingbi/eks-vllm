# Sync HF_TOKEN from AWS Secrets Manager before applying.
# Create secret: kubectl create secret generic hf-token -n vllm --from-literal=token=hf_xxx
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: hf-token
  namespace: vllm
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: hf-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: qwen-vllm/hf-token

# Requires KEDA installed in the cluster.
# Install: helm install keda kedacore/keda --namespace keda --create-namespace
#
# Scale-out signals (OR): waiting queue (primary), max GPU KV cache, TTFT p95 (tertiary).
# tokens/sec is for Grafana/alerts only — not used as a KEDA trigger.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  scaleTargetRef:
    name: vllm-qwen
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: __KEDA_MIN_REPLICAS__
  maxReplicaCount: 10
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: __KEDA_SCALEUP_STABILIZATION__
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: vllm_waiting_requests
        threshold: "__KEDA_WAITING_THRESHOLD__"
        query: sum(vllm:num_requests_waiting{namespace="vllm"})
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: vllm_gpu_cache_pressure
        threshold: "__KEDA_GPU_CACHE_THRESHOLD__"
        query: max(vllm:gpu_cache_usage_perc{namespace="vllm"})
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
        metricName: vllm_ttft_p95
        threshold: "__KEDA_TTFT_P95_THRESHOLD__"
        query: vllm:ttft:p95

# Requires KEDA installed in the cluster.
# Install: helm install keda kedacore/keda --namespace keda --create-namespace
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm-qwen
  namespace: vllm
spec:
  scaleTargetRef:
    name: vllm-qwen
  pollingInterval: 30
  cooldownPeriod: 300
  minReplicaCount: __KEDA_MIN_REPLICAS__
  maxReplicaCount: 10
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 600
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
            - type: Pods
              value: 2
              periodSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:9090
        metricName: vllm_gpu_cache_usage_perc
        threshold: "80"
        query: avg(vllm:gpu_cache_usage_perc{namespace="vllm"})
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-server.monitoring.svc.cluster.local:9090
        metricName: vllm_num_requests_running
        threshold: "5"
        query: sum(vllm:num_requests_running{namespace="vllm"})

# Pre-seed model weights on EFS from S3 before rolling out vLLM (runs on system node).
apiVersion: batch/v1
kind: Job
metadata:
  name: model-seed
  namespace: vllm
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  template:
    spec:
      serviceAccountName: vllm
      restartPolicy: OnFailure
      nodeSelector:
        role: system
      containers:
        - name: sync-model
          image: ECR_REPOSITORY_URL:model-downloader-v2
          imagePullPolicy: IfNotPresent
          env:
            - name: MODEL_PATH
              value: __MODEL_PATH_VALUE__
            - name: MODEL_S3_URI
              value: s3://__MODEL_S3_BUCKET__/__MODEL_S3_PREFIX__
          command:
            - /usr/local/bin/sync-model-from-s3.sh
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests:
              cpu: "500m"
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache

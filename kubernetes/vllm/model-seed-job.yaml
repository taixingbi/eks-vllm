# One-time job to pre-seed model weights on EFS before rolling out vLLM.
# Requires hf-token secret in vllm namespace.
apiVersion: batch/v1
kind: Job
metadata:
  name: model-seed
  namespace: vllm
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 2
  template:
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        role: system
      containers:
        - name: download
          image: ECR_REPOSITORY_URL:model-downloader
          imagePullPolicy: IfNotPresent
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: hf-token
                  key: token
                  optional: true
            - name: MODEL_ID
              value: __MODEL_ID_VALUE__
            - name: MODEL_PATH
              value: __MODEL_PATH_VALUE__
          command:
            - /bin/sh
            - -c
            - |
              set -e
              if [ -f "${MODEL_PATH}/config.json" ]; then
                echo "Model already present."
                exit 0
              fi
              huggingface-cli download "${MODEL_ID}" \
                --local-dir "${MODEL_PATH}" \
                --local-dir-use-symlinks False
          volumeMounts:
            - name: model-cache
              mountPath: /models
          resources:
            requests:
              cpu: "100m"
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 512Mi
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: model-cache

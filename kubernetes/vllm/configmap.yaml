apiVersion: v1
kind: ConfigMap
metadata:
  name: vllm-config
  namespace: vllm
data:
  MODEL_ID: "__MODEL_ID_VALUE__"
  MODEL_PATH: "__MODEL_PATH_VALUE__"
  MODEL_VERSION: "__MODEL_VERSION_VALUE__"
  MODEL_S3_URI: "s3://__MODEL_S3_BUCKET__/__MODEL_S3_PREFIX__"
  VLLM_HOST: "0.0.0.0"
  VLLM_PORT: "8000"
  DTYPE: "bfloat16"
  MAX_MODEL_LEN: "8192"
  GPU_MEMORY_UTILIZATION: "0.90"

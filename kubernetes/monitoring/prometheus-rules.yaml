apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vllm-qwen-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: vllm-qwen-recording
      interval: 30s
      rules:
        - record: vllm:queue_depth:sum
          expr: sum(vllm:num_requests_waiting{namespace="vllm"})
        - record: vllm:ttft:p95
          expr: |
            histogram_quantile(0.95,
              sum(rate(vllm:time_to_first_token_seconds_bucket{namespace="vllm"}[5m])) by (le)
            )
        - record: vllm:e2e_latency:p95
          expr: |
            histogram_quantile(0.95,
              sum(rate(vllm:e2e_request_latency_seconds_bucket{namespace="vllm"}[5m])) by (le)
            )
        - record: vllm:generation_tps:sum
          expr: sum(rate(vllm:generation_tokens_total{namespace="vllm"}[2m]))
        - record: vllm:error_rate:ratio
          expr: |
            (
              sum(rate(vllm:request_success_total{namespace="vllm", finished_reason!="stop"}[5m]))
              /
              clamp_min(sum(rate(vllm:request_success_total{namespace="vllm"}[5m])), 1e-9)
            )
        - record: vllm:ready_replicas:ratio
          expr: |
            (
              count(kube_pod_status_ready{namespace="vllm", pod=~"vllm-qwen-.*", condition="true"} == 1)
              /
              clamp_min(
                count(kube_deployment_status_replicas{namespace="vllm", deployment="vllm-qwen"}),
                1
              )
            )

    - name: vllm-qwen-slo
      rules:
        - alert: VLLMSLOTTFTBreached
          expr: vllm:ttft:p95 > 2
          for: 5m
          labels:
            severity: warning
            slo: ttft_p95
          annotations:
            summary: "SLO breach: TTFT p95 > 2s"
            description: "p95 time-to-first-token is {{ $value }}s (target < 2s)."

        - alert: VLLMSLOLatencyBreached
          expr: vllm:e2e_latency:p95 > 10
          for: 5m
          labels:
            severity: warning
            slo: e2e_p95
          annotations:
            summary: "SLO breach: end-to-end p95 latency > 10s"
            description: "p95 end-to-end latency is {{ $value }}s (target < 10s)."

        - alert: VLLMSLOErrorRateBreached
          expr: vllm:error_rate:ratio > 0.01
          for: 5m
          labels:
            severity: critical
            slo: error_rate
          annotations:
            summary: "SLO breach: error rate > 1%"
            description: "Non-stop finished_reason ratio is {{ $value | humanizePercentage }} (target < 1%)."

        - alert: VLLMSLOAvailabilityBreached
          expr: vllm:ready_replicas:ratio < 0.995
          for: 15m
          labels:
            severity: critical
            slo: availability
          annotations:
            summary: "SLO breach: ready replicas < 99.5%"
            description: "Ready ratio is {{ $value | humanizePercentage }} (target >= 99.5%). Requires kube-state-metrics."

    - name: vllm-qwen
      rules:
        - alert: VLLMPodNotReady
          expr: |
            kube_pod_status_ready{namespace="vllm", pod=~"vllm-qwen-.*", condition="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "vLLM pod not ready for 5+ minutes"
            description: "Pod {{ $labels.pod }} in namespace vllm is not ready."

        - alert: VLLMHighGPUCacheUsage
          expr: max(vllm:gpu_cache_usage_perc{namespace="vllm"}) > 0.95
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "vLLM GPU KV cache above 95% on at least one replica"
            description: "Max GPU cache usage is {{ $value | humanizePercentage }} — consider scaling replicas."

        - alert: VLLMHighRequestQueue
          expr: vllm:queue_depth:sum > 10
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "vLLM request queue depth high"
            description: "{{ $value }} requests waiting — scale-out may be needed."

        - alert: VLLMHighTTFT
          expr: vllm:ttft:p95 > 2
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "vLLM TTFT p95 exceeds 2s"
            description: "p95 time-to-first-token is {{ $value }}s — check cold start, prompt length, or capacity."

        - alert: VLLMHighP95Latency
          expr: vllm:e2e_latency:p95 > 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "vLLM p95 end-to-end latency exceeds 10s"
            description: "p95 end-to-end latency is {{ $value }}s (SLO target < 10s)."

        - alert: VLLMThroughputSaturation
          expr: |
            vllm:queue_depth:sum > 0
            and vllm:generation_tps:sum > 20
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: "vLLM saturated — queue building while generating tokens"
            description: "{{ $value }} waiting requests with active generation throughput — scale-out likely needed."

        - alert: VLLMThroughputStall
          expr: |
            vllm:queue_depth:sum > 3
            and vllm:generation_tps:sum == 0
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "vLLM queue growing with no token generation"
            description: "Waiting queue is high but tokens/sec is zero — possible cold start, stuck requests, or scheduling issue."

        - alert: KarpenterSpotInterruptionRate
          expr: increase(karpenter_interruption_received_messages_total[15m]) > 3
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "Elevated Spot interruption rate"
            description: "Multiple Spot interruptions in the last 15 minutes — verify On-Demand baseline and preStop drain."

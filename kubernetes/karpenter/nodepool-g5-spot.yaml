apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: g5-spot
spec:
  template:
    metadata:
      labels:
        workload: gpu
        capacity-type: spot
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: g5-gpu
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["INSTANCE_FAMILY"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: [__KARPENTER_INSTANCE_SIZES__]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["spot"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      expireAfter: 720h
  limits:
    cpu: "128"
    memory: 512Gi
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 5m
  # Lower weight than g5-ondemand (100) — burst only; Karpenter prefers On-Demand.
  weight: 10

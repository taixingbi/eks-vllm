# Patched by scripts/patch-manifests.sh from Terraform outputs.
# GPU networking: dev uses public subnets + public IP; prod uses private subnets only.
# Placeholders: CLUSTER_NAME, KARPENTER_NODE_ROLE_NAME,
#   __KARPENTER_SUBNET_DISCOVERY_TAG_KEY__, __KARPENTER_ASSOCIATE_PUBLIC_IP__

apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: g5-gpu
spec:
  amiSelectorTerms:
    - alias: al2023@latest
  role: KARPENTER_NODE_ROLE_NAME
  associatePublicIPAddress: __KARPENTER_ASSOCIATE_PUBLIC_IP__
  subnetSelectorTerms:
    - tags:
        __KARPENTER_SUBNET_DISCOVERY_TAG_KEY__: CLUSTER_NAME
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: CLUSTER_NAME
  blockDeviceMappings:
    - deviceName: /dev/xvda
      ebs:
        volumeSize: 100Gi
        volumeType: gp3
        encrypted: true
        deleteOnTermination: true
  metadataOptions:
    httpEndpoint: enabled
    httpProtocolIPv6: disabled
    httpPutResponseHopLimit: 2
    httpTokens: required
  tags:
    Project: qwen-vllm
    NodePool: g5-gpu

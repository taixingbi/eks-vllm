apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: g5-ondemand
spec:
  template:
    metadata:
      labels:
        workload: gpu
        capacity-type: on-demand
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: g5-gpu
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["INSTANCE_FAMILY"]
        - key: karpenter.k8s.aws/instance-size
          operator: In
          values: [__KARPENTER_INSTANCE_SIZES__]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: kubernetes.io/arch
          operator: In
          values: ["amd64"]
      taints:
        - key: nvidia.com/gpu
          value: "true"
          effect: NoSchedule
      expireAfter: 720h
  limits:
    cpu: "__NODEPOOL_CPU_LIMIT__"
    memory: __NODEPOOL_MEMORY_LIMIT__
  disruption:
    consolidationPolicy: __NODEPOOL_CONSOLIDATION_POLICY__
    consolidateAfter: __NODEPOOL_CONSOLIDATE_AFTER__
  weight: 100

name: Terraform Plan

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write

jobs:
  resolve-environment:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            ENV="prod"
          elif [[ "${{ github.base_ref }}" == "dev" ]]; then
            ENV="dev"
          else
            echo "Unsupported base branch: ${{ github.base_ref }}"
            exit 1
          fi
          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"

  plan:
    name: Terraform Plan (${{ needs.resolve-environment.outputs.environment }})
    needs: resolve-environment
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: true
      TF_ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Terraform Init
        working-directory: terraform/environments/${{ needs.resolve-environment.outputs.environment }}
        run: terraform init

      - name: Import preserved S3 model bucket (if exists)
        run: ./scripts/import-s3-models.sh

      - name: Terraform Plan
        id: plan
        working-directory: terraform/environments/${{ needs.resolve-environment.outputs.environment }}
        run: |
          set +e
          terraform plan -no-color -lock-timeout=15m -out=tfplan 2>&1 | tee plan.txt
          echo "exitcode=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Comment plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const env = '${{ needs.resolve-environment.outputs.environment }}';
            const planPath = `terraform/environments/${env}/plan.txt`;
            const fs = require('fs');
            const plan = fs.existsSync(planPath)
              ? fs.readFileSync(planPath, 'utf8')
              : 'Plan failed or produced no output.';
            const shortSha = context.payload.pull_request.head.sha.slice(0, 7);
            const body = `#### Terraform Plan (${env}) \`${shortSha}\`
            <details><summary>Show Plan</summary>

            \`\`\`
            ${plan.slice(0, 60000)}
            \`\`\`

            </details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan failed
        if: steps.plan.outputs.exitcode != '0'
        run: exit 1

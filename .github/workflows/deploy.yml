name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        required: true
        default: prod
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

jobs:
  resolve-environment:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
    steps:
      - id: resolve
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            ENV="prod"
          elif [[ "${{ github.ref }}" == "refs/heads/dev" ]]; then
            ENV="dev"
          else
            echo "Unsupported ref: ${{ github.ref }}"
            exit 1
          fi
          echo "environment=${ENV}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy (${{ needs.resolve-environment.outputs.environment }})
    needs: resolve-environment
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve-environment.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.resolve-environment.outputs.environment }}
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: true
      TF_ENVIRONMENT: ${{ needs.resolve-environment.outputs.environment }}
      INSTANCE_TYPE: ${{ vars.INSTANCE_TYPE }}
      MODEL_NAME: ${{ vars.MODEL_NAME }}
      MODEL_VERSION: ${{ vars.MODEL_VERSION }}
      DEV_ENABLE_PROMETHEUS: ${{ vars.DEV_ENABLE_PROMETHEUS }}
      DEV_ENABLE_GRAFANA: ${{ vars.DEV_ENABLE_GRAFANA }}
      DEV_ENABLE_KEDA: ${{ vars.DEV_ENABLE_KEDA }}
      DEV_ENABLE_ALB: ${{ vars.DEV_ENABLE_ALB }}
      DEV_ALB_HTTP_ONLY: ${{ vars.DEV_ALB_HTTP_ONLY }}
      DEV_ENABLE_ROUTER: ${{ vars.DEV_ENABLE_ROUTER }}
      DEV_ENABLE_LMCACHE: ${{ vars.DEV_ENABLE_LMCACHE }}
      ROUTER_ROUTING_LOGIC: ${{ vars.ROUTER_ROUTING_LOGIC }}
      KARPENTER_CHART_VERSION: ${{ vars.KARPENTER_CHART_VERSION }}
      ALB_CHART_VERSION: ${{ vars.ALB_CHART_VERSION }}
      AWS_EFS_CSI_CHART_VERSION: ${{ vars.AWS_EFS_CSI_CHART_VERSION }}
      KUBE_PROMETHEUS_STACK_CHART_VERSION: ${{ vars.KUBE_PROMETHEUS_STACK_CHART_VERSION }}
      KEDA_CHART_VERSION: ${{ vars.KEDA_CHART_VERSION }}
      EXTERNAL_SECRETS_CHART_VERSION: ${{ vars.EXTERNAL_SECRETS_CHART_VERSION }}
      NVIDIA_DEVICE_PLUGIN_VERSION: ${{ vars.NVIDIA_DEVICE_PLUGIN_VERSION }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6

      - name: Terraform Init
        working-directory: terraform/environments/${{ needs.resolve-environment.outputs.environment }}
        run: terraform init

      - name: Import preserved S3 model bucket (if exists)
        run: ./scripts/import-s3-models.sh

      - name: Terraform Apply
        working-directory: terraform/environments/${{ needs.resolve-environment.outputs.environment }}
        run: terraform apply -auto-approve -lock-timeout=15m

      - name: Configure kubectl
        run: |
          CLUSTER_NAME=$(cd "terraform/environments/${TF_ENVIRONMENT}" && terraform output -raw cluster_name)
          aws eks update-kubeconfig --region "${AWS_REGION}" --name "${CLUSTER_NAME}"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Install ALB Controller and Karpenter
        run: ./scripts/install-controllers.sh

      - name: Install cluster add-ons
        run: ./scripts/install-addons.sh

      - name: Sync HF token to Secrets Manager
        if: needs.resolve-environment.outputs.environment != 'dev'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: ./scripts/sync-hf-secret.sh

      - name: Free disk space for Docker build
        run: ./scripts/ci-free-disk.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push vLLM image
        env:
          VLLM_IMAGE_TAG: v0.8.4
          MODEL_DOWNLOADER_TAG: model-downloader-v2
          SKIP_ECR_BUILD_IF_EXISTS: "1"
        run: ./scripts/build-push-image.sh

      - name: Verify model artifacts in S3
        run: |
          source ./scripts/lib/env.sh
          cd "terraform/environments/${TF_ENVIRONMENT}"
          BUCKET=$(terraform output -raw model_artifacts_bucket_name)
          MANIFEST="s3://${BUCKET}/${MODEL_S3_PREFIX}/.model-manifest.json"
          echo "Checking ${MANIFEST} ..."
          aws s3 ls "${MANIFEST}"

      - name: Deploy Kubernetes manifests
        env:
          ACM_CERTIFICATE_ARN: ${{ secrets.ACM_CERTIFICATE_ARN }}
          INFERENCE_HOSTNAME: ${{ secrets.INFERENCE_HOSTNAME }}
        run: ./scripts/deploy-k8s.sh

      - name: Wait for vLLM rollout
        run: |
          if [[ "${TF_ENVIRONMENT}" == "dev" ]]; then
            kubectl rollout status deployment/vllm-qwen -n vllm --timeout=45m
          else
            kubectl rollout status deployment/vllm-qwen -n vllm --timeout=20m
          fi
          kubectl get pods -n vllm
          kubectl get nodes -l workload=gpu 2>/dev/null || true

      - name: Smoke test inference (dev)
        if: needs.resolve-environment.outputs.environment == 'dev'
        run: |
          source ./scripts/lib/env.sh
          kubectl port-forward -n vllm svc/vllm-qwen 8000:8000 &
          PF_PID=$!
          trap "kill ${PF_PID} 2>/dev/null || true" EXIT
          READY=false
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/v1/models >/dev/null 2>&1; then
              READY=true
              break
            fi
            sleep 10
          done
          if [[ "${READY}" != "true" ]]; then
            echo "vLLM API not ready after 10 minutes"
            curl -s http://localhost:8000/v1/models || true
            exit 1
          fi
          echo "Available models:"
          curl -s http://localhost:8000/v1/models
          curl -sf http://localhost:8000/v1/chat/completions \
            -H "Content-Type: application/json" \
            -d "{\"model\":\"${MODEL_PATH}\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":32}"

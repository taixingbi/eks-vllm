# Checkov policy config (P1). Tighten skips as infra hardens (Step 10).
compact: true
quiet: false
framework:
  - terraform
download-external-modules: true
evaluate-variables: true
skip-check:
  # EKS public API — required for GitHub Actions without private runner/VPN.
  - CKV_AWS_38
  # EKS control plane logging not fully enabled yet.
  - CKV_AWS_37
  # EKS secrets envelope encryption not enabled yet.
  - CKV_AWS_58
  # Registry modules use semver (~> 20.0), not git commit hashes.
  - CKV_TF_1
  # CloudWatch agent / Karpenter IRSA policies use Resource "*" (AWS-managed patterns).
  - CKV_AWS_356
  - CKV_AWS_109
  - CKV_AWS_111
  # Secrets Manager rotation — HF token rotated manually.
  - CKV_AWS_304
  # Default egress 0.0.0.0/0 on security groups (standard AWS pattern).
  - CKV2_AWS_5

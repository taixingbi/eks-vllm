# Checkov policy config (P1). Tighten skips as infra hardens (Step 10).
compact: true
quiet: false
framework:
  - terraform
download-external-modules: true
evaluate-variables: true
# One-time bootstrap stack; not part of dev/prod deploy path.
# Paths are relative to scan root (terraform/environments in CI, or terraform/ locally).
skip-path:
  - bootstrap
  - ^bootstrap/
skip-check:
  # --- EKS (GitHub Actions needs public API; hardening in Step 10) ---
  - CKV_AWS_38   # public endpoint 0.0.0.0/0
  - CKV_AWS_37   # control plane logging types
  - CKV_AWS_58   # secrets envelope encryption
  - CKV_AWS_338  # CloudWatch log retention >= 1 year
  # --- Terraform registry modules ---
  - CKV_TF_1     # semver modules, not git commit hash
  # --- IAM (CloudWatch agent / Karpenter IRSA patterns) ---
  - CKV_AWS_109
  - CKV_AWS_111
  - CKV_AWS_290
  - CKV_AWS_355
  - CKV_AWS_356
  # --- VPC module (terraform-aws-modules/vpc) ---
  - CKV_AWS_130  # public subnets assign public IP (required for NAT/system nodes)
  - CKV2_AWS_11  # VPC flow logs
  - CKV2_AWS_12  # default SG restrict all traffic
  - CKV2_AWS_19  # NAT gateway EIPs not on EC2 instances
  # --- ECR ---
  - CKV_AWS_51   # immutable tags (CI re-pushes :v0.8.4)
  - CKV_AWS_136  # ECR KMS CMK
  # --- EFS ---
  - CKV_AWS_382  # SG egress all protocols to 0.0.0.0/0
  - CKV_AWS_184  # EFS customer-managed KMS (uses AWS-managed encryption)
  # --- Secrets / SG egress ---
  - CKV_AWS_304  # Secrets Manager rotation
  - CKV2_AWS_5   # SG egress 0.0.0.0/0
  # --- Bootstrap state backend (terraform/bootstrap; one-time, not in deploy path) ---
  - CKV_AWS_28   # DynamoDB PITR
  - CKV_AWS_119  # DynamoDB KMS CMK
  - CKV_AWS_18   # S3 access logging
  - CKV_AWS_145  # S3 KMS CMK
  - CKV_AWS_144  # S3 cross-region replication
  - CKV2_AWS_61  # S3 lifecycle
  - CKV2_AWS_62  # S3 event notifications
